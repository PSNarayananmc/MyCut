[package]
name = "mycut-app"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
mycut-core = { path = "../crates/core" }
mycut-projects = { path = "../crates/projects", features = ["os-keyring"] }
mycut-schema = { path = "../crates/schema" }
mycut-engine = { path = "../crates/engine" }
mycut-analysis = { path = "../crates/analysis" }
mycut-captions = { path = "../crates/captions" }
mycut-ai = { path = "../crates/ai" }
serde = "1"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
