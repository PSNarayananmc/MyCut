[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/projects",
    "crates/schema",
    "crates/engine",
    "crates/analysis",
    "crates/captions",
    "crates/ai",
    "crates/cli",
]
# The GUI shell needs webkit2gtk; headless CI builds/tests default-members only.
default-members = [
    "crates/core",
    "crates/projects",
    "crates/schema",
    "crates/engine",
    "crates/analysis",
    "crates/captions",
    "crates/ai",
    "crates/cli",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/mycut"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
keyring = { version = "3" }
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
